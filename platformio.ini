; Favero_OPP2 — Favero data bridge
; PlatformIO Project Configuration File
;
; Environments:
;   esp32dev — the bridge firmware (mixed Arduino + ESP-IDF framework,
;              matching the rest of the OpenPiste ecosystem)
;   native   — host-side unit tests for FaveroSerialDecoder (no hardware)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino, espidf
monitor_speed = 115200
board_build.filesystem = spiffs
board_build.sdkconfig = sdkconfig.defaults
; Default 1MB app partition overflows: IRremoteESP8266 compiles its full
; multi-vendor protocol set regardless of which sendXxx() we actually call.
; huge_app.csv trades away the OTA partition slot for a ~3MB single app
; partition -- fine for now since OTA isn't implemented yet.
board_build.partitions = partitions.csv

lib_deps =
    https://github.com/OpenPiste/opp2-library
    bblanchon/ArduinoJson @ ^7.0.0
    ; me-no-dev's originals, not the esp32async fork -- the fork targets
    ; newer arduino-esp32 3.x cores and added ~700ms to every request's
    ; time-to-first-byte (reproduced even on plain static file serving,
    ; zero app logic) on this project's arduino-esp32 2.0.14. Matches what
    ; esp32scoringdeviceMqtt already uses successfully on this exact toolchain.
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    tzapu/WiFiManager
    ; Fork of crankyoldgit/IRremoteESP8266 (based on v2.8.6) with Favero
    ; FA-05 protocol support (sendFavero/decodeFavero) added -- not present
    ; upstream. Pinned to a commit for reproducible builds.
    https://github.com/pietwauters/IRremoteESP8266.git#e545abdfd7fa95ae7a0886f1bd62a97faaae0b3c
    ; MQTT is esp_mqtt_client (ESP-IDF native component, available
    ; automatically -- no lib_deps entry needed, same as
    ; esp32scoringdeviceMqtt). PubSubClient/WiFiClient was tried first but
    ; never delivered a single incoming message on this toolchain --
    ; subscribe() reported success but the callback never fired, even for
    ; an unrelated throwaway test topic.

build_flags =
    -DSEND_FAVERO=1
    -DCORE_DEBUG_LEVEL=2
    -DESP_TIMER_TASK_CORE=1  ; required by the shared framework-espidf package (patched by esp32scoringdeviceMqtt's patch_esp_timer.py)

[env:native]
; Host-side unit tests for lib/FaveroSerialDecoder (no hardware, no
; Arduino/ESP-IDF deps). src/ is Arduino-only, so it's excluded here —
; only lib/ (auto-linked by PlatformIO) and test/ are built.
platform = native
test_framework = doctest
build_flags =
    -std=c++11
    -Wall
    -Wextra
build_src_filter = -<*>
