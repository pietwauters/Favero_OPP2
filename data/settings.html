<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Favero_OPP2 — Settings</title>
  <meta name="viewport" content="height=device-height, initial-scale=1">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

  <nav>
    <a href="/">Remote</a>
    <a href="/repeater.html">Repeater</a>
    <a href="/opp2.html">OPP2</a>
    <a href="/settings.html" class="active">Settings</a>
  </nav>

  <div class="panel">
    <h3>OPP2 / MQTT</h3>
    <div class="form-row">
      <label for="pisteId">Piste ID</label>
      <input id="pisteId" type="text" maxlength="15">
    </div>
    <div class="form-row">
      <label for="mqttBroker">MQTT broker host</label>
      <input id="mqttBroker" type="text" maxlength="63">
    </div>
    <div class="form-row">
      <label for="mqttPort">MQTT port</label>
      <input id="mqttPort" type="number" min="1" max="65535">
    </div>
    <div class="actionbar">
      <button onclick="saveSettings()">Save &amp; reboot</button>
    </div>

    <h3>WiFi</h3>
    <p>Current network: <span id="wifiSsid">--</span> (<span id="wifiIp">--</span>)</p>
    <p>Also reachable at <a id="mdnsLink" href="#"><span id="mdnsHostname">--</span>.local</a>
      -- changes when Piste ID is saved.</p>
    <div class="actionbar">
      <button onclick="resetWifi()" class="danger">Reconfigure WiFi</button>
    </div>
    <p style="font-size:14px;color:#aaa;">
      Reboots into setup mode: connect to the <strong>Favero_OPP2-setup</strong>
      WiFi network to pick a new network and re-enter these settings.
    </p>

    <div id="statusLine" class="status-line"></div>
  </div>

  <script>
    async function loadSettings() {
      const res = await fetch('/api/settings-info');
      const s = await res.json();
      document.getElementById('pisteId').value = s.pisteId;
      document.getElementById('mqttBroker').value = s.mqttBroker;
      document.getElementById('mqttPort').value = s.mqttPort;
      document.getElementById('wifiSsid').textContent = s.wifiSsid;
      document.getElementById('wifiIp').textContent = s.wifiIp;
      document.getElementById('mdnsHostname').textContent = s.mdnsHostname;
      document.getElementById('mdnsLink').href = `http://${s.mdnsHostname}.local/`;
    }

    async function saveSettings() {
      if (navigator.vibrate) navigator.vibrate(100);
      const pisteId = encodeURIComponent(document.getElementById('pisteId').value);
      const mqttBroker = encodeURIComponent(document.getElementById('mqttBroker').value);
      const mqttPort = encodeURIComponent(document.getElementById('mqttPort').value);
      document.getElementById('statusLine').textContent = 'Saving, rebooting...';
      await fetch(`/api/settings-save?pisteId=${pisteId}&mqttBroker=${mqttBroker}&mqttPort=${mqttPort}`);
      document.getElementById('statusLine').textContent = 'Rebooted -- reload in a few seconds.';
    }

    function resetWifi() {
      if (!confirm('Reboot into WiFi setup mode? You will need to reconnect to the Favero_OPP2-setup network.')) return;
      if (navigator.vibrate) navigator.vibrate(100);
      fetch('/api/wifi/reset');
      document.getElementById('statusLine').textContent = 'Rebooting into setup mode...';
    }

    loadSettings();
  </script>

</body>
</html>
