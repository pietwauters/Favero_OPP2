<html>
<head>

  <link rel="icon" href="data:,">

<body>

  <nav>

  <div class="grid-item"><a href="/FaveroRearm"><button class="button buttonyellow">Rearm</button></a></div>
  <div class="grid-item"><a href="/FaveroPause"><button class="button buttongreen">Pause<br/>1min</button></a></div>

  <div class="grid-item"><a href="/FaveroPlusLeft"><button class="button buttonredshorttext">+</button></a></div>
  <div class="grid-item"><a href="/FaveroReset"><button class="button buttonred">Mise <br/>a zero</button></a></div>
  <div class="grid-item"><a href="/FaveroPlusRight"><button class="button buttonredshorttext">+</button></a></div>

  <div class="grid-item"><a href="/FaveroRedLeft"><button class="button buttonred buttoncard">Red<br/>Card</button></a></div>
  <div class="grid-item"><a href="/FaveroSet"><button class="button buttongreen">Set </button></a></div>
  <div class="grid-item"><a href="/FaveroRedRight"><button class="button buttonred buttoncard">Red<br/>Card</button></a></div>

  <div class="grid-item"><a href="/FaveroYellowLeft"><button class="button buttonyellow buttoncard">Yellow<br/>Card</button></a></div>
  <div class="grid-item"><a href="/FaveroMatchCount"><button class="button">Match<br/>Count</button></a></div>

  </div>

  <script>
    // Haptic feedback on button press -- navigator.vibrate() is
    // unsupported on iOS Safari (Apple has never implemented it, even for
    // home-screen web apps), so the feature check above doubles as the
    // "only where supported" behavior; it's simply a no-op there.
    if (navigator.vibrate) {
      document.querySelectorAll('.grid-item a').forEach(function (link) {
        link.addEventListener('click', function () { navigator.vibrate(50); });
      });
    }
  </script>

</body>
